name: eval
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"        # nightly e2e
  workflow_dispatch:
jobs:
  eval-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyyaml
      - run: python tests/eval_dialogues.py --repo . --layer unit
      - name: Verified social-scholarship scenario (no LLM)
        run: python tests/test_social_scenario.py
      - name: Docker image build and container smoke
        run: |
          docker build -t ur-asystent-ci .
          sh scripts/ci_docker_smoke.sh
  eval-e2e-pr:
    # LLM golden subset — advisory on PRs until verified scenarios cover those paths.
    # Does not block merge: answers vary by model; required gate is eval-unit.
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMBED_PROVIDER: gemini
      SESSION_SECRET: ci-only
      SCENARIO_SOCIAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyyaml
      - name: Skip if no LLM secret
        id: gate
        run: |
          if [ -z "${LLM_API_KEY}" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "LLM_API_KEY missing — skipping e2e-pr"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Critical e2e subset (e2e_pr, advisory)
        if: steps.gate.outputs.skip != '1'
        run: python tests/eval_dialogues.py --repo . --layer e2e --e2e-pr --runs 1
  eval-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: anthropic
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # embeddings only
      EMBED_PROVIDER: gemini
      SESSION_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt pyyaml
      - name: Check provider wiring
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "app")
          assert os.environ.get("LLM_PROVIDER") == "anthropic"
          import rag
          # status-style report (no network)
          print("provider_env=", os.environ.get("LLM_PROVIDER"))
          print("llm_enabled=", rag.llm_enabled())
          PY
      - run: python tests/eval_dialogues.py --repo . --layer e2e --runs 3
