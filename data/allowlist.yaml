# Admin-controlled crawl allowlist. Phase 1 draft, 2026-11-09.
# Hosts are only those already used as crawl seeds, corpus URLs, or cited fact URLs.
# There is no function that appends a host from application code.
# enabled: true is what the crawler may fetch.
# On 2026-11-09 Kostya Prochan approved only the official fact domains listed below
# that were still off. kn, wicit, squarespace, isap.sejm.gov.pl, and odyseusz stay off.
