# Verified scenario: social scholarship (stypendium socjalne).
# Amounts/dates come ONLY from data/facts.yaml via fact_id refs — do not duplicate figures here.
id: social_scholarship
# Product switch: SCENARIO_SOCIAL=1 enables UI + no-LLM chat answers for this scenario.
feature_env: SCENARIO_SOCIAL
# Estimator uses this year unless the client passes another. Only years with confirmed amount facts are calculable.
default_estimate_year: "2025/2026"
fact_refs:
  income_and_amounts: social_income_threshold
  caps:
    - rector_social_cap_monthly_2025_2026
    - rector_social_cap_monthly
  application_window: social_rector_deadline
  submission_channel: submission_channel
  ua_temporary_protection: ukr_special_act
official_links:
  - fact_id: social_income_threshold
  - fact_id: social_rector_deadline
  - url: https://student.uniwersytetradom.pl/stypendia-socjalne/
    label_key: link_social_page
  - url: https://bip.uniwersytetradom.pl/attachments/4338/download
    label_key: link_regulamin
i18n:
  pl:
    title: Stypendium socjalne
    badge_verified: Scenariusz sprawdzony
    badge_other: Inne tematy — wyszukiwanie w korpusie (niesprawdzone automatycznie)
    intro: >-
      Poniższe kwoty grup dochodowych pochodzą z oficjalnego aneksu UR na wskazany rok.
      Kalkulator podaje tylko szacunek wysokości przy danym dochodzie — nie decyzję o prawie do świadczenia.
    conditions_title: Warunki (skrót)
    conditions_body: >-
      Trudna sytuacja materialna (dochód na osobę w rodzinie w limicie na dany rok), status studenta UR,
      zwykle jeden kierunek. Obywatele UA z ochroną czasową / PESEL UKR — osobne zasady (patrz fakt UA).
      Sam dochód nie wystarcza do stwierdzenia uprawnienia.
    amounts_title: Wysokość (grupy dochodowe)
    amounts_period_label: rok tabeli kwot
    amounts_note: >-
      Kwoty bazowe według tabeli UR na wskazany rok tabeli. Zwiększenie z tytułu zakwaterowania jest warunkowe
      (Regulamin § 12) i nie jest doliczane automatycznie do wyniku.
    dorm_topup_title: Zwiększenie (akademik / inny obiekt)
    dorm_topup_rule: >-
      Zwiększenie przysługuje w szczególnie uzasadnionych przypadkach (Regulamin § 12 / R-32/2024):
      koszty zamieszkania w domu studenta albo w innym obiekcie, w szczególności gdy brak miejsc w domu studenta,
      jeżeli codzienny dojazd z miejsca stałego zamieszkania uniemożliwiałby lub w znacznym stopniu utrudniał studiowanie.
      To samo dotyczy zamieszkania z niepracującym małżonkiem lub dzieckiem studenta, gdy spełniony jest ten warunek dojazdu.
      Wymagany jest skan umowy o zakwaterowanie w domu studenckim lub umowy najmu.
      Samo zamieszkanie w domu studenta bez tych przesłanek nie wystarcza.
      Wysokość zwiększenia na dany rok podaje tabela kwot tego roku.
    deadlines_title: Terminy składania wniosków
    deadlines_period_label: rok okna wniosków
    deadlines_note: >-
      Okno wniosków może dotyczyć innego roku akademickiego niż tabela kwot powyżej — nie mieszamy tych okresów.
    documents_title: Dokumenty
    documents_body: >-
      Wniosek elektroniczny w Wirtualnej Uczelni. Przy zwiększeniu — skan umowy o zakwaterowanie lub najem.
      Pełna lista załączników: oficjalna strona świadczeń / regulamin. Pozycji spoza potwierdzonych źródeł nie uzupełniamy.
    documents_status: partial
    links_title: Oficjalne źródła
    form_title: Szacunek wysokości (nie decyzja)
    form_income: Dochód na osobę w rodzinie (zł)
    form_year: Rok akademicki tabeli kwot
    form_dorm: Interesuje mnie zwiększenie z tytułu zakwaterowania
    form_submit: Oblicz szacunek
    form_hint: 0 zł można wpisać, ale tabela 2025/2026 zaczyna się od 0,01 zł — dla 0,00 zł nie podajemy grupy ani stawki. Zwiększenie pokazujemy osobno, jeśli warunki nie są potwierdzone.
    result_base: Kwota bazowa (szacunek)
    result_group: Grupa dochodowa
    result_topup_conditional: Zwiększenie warunkowe (nie wliczone do sumy)
    result_topup_included: Zwiększenie (wliczone do sumy — warunki potwierdzone)
    result_total_base_only: Suma do pokazania (tylko baza)
    result_total_with_topup: Suma (baza + zwiększenie)
    result_not_eligibility: To nie jest decyzja o prawie do stypendium.
    err_input: Nieprawidłowa kwota dochodu.
    err_outside_band: "{income} to poprawny wpis, ale opublikowana tabela na rok {year} nie przypisuje tej kwocie grupy ani stawki (pierwsza kwota w tabeli: {min}). Nie podajemy wypłaty i nie uznajemy tego za grupę I."
    err_over: Dochód przekracza próg tabeli na ten rok — brak kwoty w tej tabeli.
    err_year: Brak potwierdzonej tabeli kwot UR dla wybranego roku — nie podajemy aktualnego wyliczenia.
    err_eligibility: Brakuje danych o prawie do świadczenia (status studenta, kierunek itd.) — kwotę bazową można oszacować osobno, prawa nie stwierdzamy.
    chat_card_header: Stypendium socjalne — scenariusz sprawdzony (bez modelu językowego)
    chat_see_form: Użyj formularza szacunku na stronie, aby policzyć grupę z dochodu.
    chat_no_reask: Uwzględniono już podany dochód z formularza / profilu.
    link_social_page: Stypendia socjalne (UR)
    link_regulamin: Regulamin świadczeń (R-32/2024)
    verified_data_word: potwierdzonych danych
    year_banner_confirmed: "Tabela kwot potwierdzona dla roku {year}."
    year_banner_unconfirmed: "Dla roku {year} brak potwierdzonej tabeli kwot UR — szacunek nie jest traktowany jako aktualny."
  en:
    title: Social scholarship
    badge_verified: Verified scenario
    badge_other: Other topics — corpus search (not auto-verified)
    intro: >-
      Income-group amounts come from the official UR annex for the stated year.
      The calculator only estimates the amount for a given income — it does not decide entitlement.
    conditions_title: Conditions (summary)
    conditions_body: >-
      Difficult financial situation (income per family member within the year limit), UR student status,
      usually one programme. UA citizens with temporary protection / PESEL UKR — special rules (see UA fact).
      Income alone does not prove entitlement.
    amounts_title: Amounts (income groups)
    amounts_period_label: amount-table year
    amounts_note: >-
      Base amounts from the UR table for the stated amount-table year. The accommodation top-up is conditional
      (Regulations § 12) and is not added automatically to the result.
    dorm_topup_title: Top-up (dorm / other housing)
    dorm_topup_rule: >-
      The top-up applies in specially justified cases (Regulations § 12 / R-32/2024): housing costs in a
      student dorm or another facility, in particular when there are no dorm places, if daily travel from
      the permanent residence would prevent or seriously hinder studying. The same applies to living there
      with a non-working spouse or the student's child when that travel condition is met. A scan of the
      dorm contract or a lease is required. Living in a dorm alone, without those conditions, is not enough.
      The top-up amount for a given year comes from that year's amount table.
    deadlines_title: Application window
    deadlines_period_label: application-window year
    deadlines_note: >-
      The application window may belong to a different academic year than the amount table above — we do not mix those periods.
    documents_title: Documents
    documents_body: >-
      Electronic application in Wirtualna Uczelnia. For the top-up — scan of housing or rental contract.
      Full attachment list: official benefits page / regulations. We do not invent items outside confirmed sources.
    documents_status: partial
    links_title: Official sources
    form_title: Amount estimate (not a decision)
    form_income: Income per family member (PLN)
    form_year: Academic year of the amount table
    form_dorm: I am interested in the accommodation top-up
    form_submit: Calculate estimate
    form_hint: 0 PLN can be entered, but the 2025/2026 table starts at 0.01 PLN — 0.00 PLN gets no group and no amount. The top-up is shown separately unless conditions are confirmed.
    result_base: Base amount (estimate)
    result_group: Income group
    result_topup_conditional: Conditional top-up (not included in total)
    result_topup_included: Top-up (included in total — conditions confirmed)
    result_total_base_only: Displayed total (base only)
    result_total_with_topup: Total (base + top-up)
    result_not_eligibility: This is not an entitlement decision.
    err_input: Invalid income amount.
    err_outside_band: "{income} is a valid entry, but the published table for {year} assigns no group and no amount to it (first amount in the table: {min}). We do not state a payout and we do not treat this as group I."
    err_over: Income exceeds the table threshold for this year — no amount in this table.
    err_year: No confirmed UR amount table for the selected year — calculation is not treated as current.
    err_eligibility: Entitlement data is incomplete (student status, programme, etc.) — base amount may be estimated separately; we do not confirm entitlement.
    chat_card_header: Social scholarship — verified scenario (no language model)
    chat_see_form: Use the estimate form on the page to map income to a group.
    chat_no_reask: Already using income provided via the form / profile.
    link_social_page: Social scholarships (UR)
    link_regulamin: Benefits regulations (R-32/2024)
    verified_data_word: verified data
    year_banner_confirmed: "Amount table confirmed for {year}."
    year_banner_unconfirmed: "No confirmed UR amount table for {year} — estimate is not treated as current."
  uk:
    title: Соціальна стипендія
    badge_verified: Перевірений сценарій
    badge_other: Інші теми — пошук у корпусі (не підтверджено автоматично)
    intro: >-
      Суми груп доходу взято з офіційного анексу UR за вказаний рік.
      Калькулятор лише оцінює розмір за доходом — це не рішення про право на виплату.
    conditions_title: Умови (скорочено)
    conditions_body: >-
      Складне матеріальне становище (дохід на особу в родині в межах ліміту на рік), статус студента UR,
      зазвичай один напрям. Громадяни UA з тимчасовим захистом / PESEL UKR — окремі правила (факт UA).
      Самого доходу недостатньо, щоб стверджувати право на виплату.
    amounts_title: Розмір (групи доходу)
    amounts_period_label: рік таблиці сум
    amounts_note: >-
      Базові суми з таблиці UR за вказаний рік таблиці. Надбавка за проживання умовна
      (Регламент § 12) і не додається до підсумку автоматично.
    dorm_topup_title: Надбавка (гуртожиток / інше житло)
    dorm_topup_rule: >-
      Надбавка надається в особливо обґрунтованих випадках (Регламент § 12 / R-32/2024):
      витрати на проживання в гуртожитку або іншому об'єкті, зокрема коли немає місць у гуртожитку,
      якщо щоденний проїзд із місця постійного проживання унеможливлював би або суттєво ускладнював навчання.
      Те саме стосується проживання з непрацюючим чоловіком чи дружиною або дитиною студента, якщо виконано цю умову проїзду.
      Потрібен скан договору про проживання в гуртожитку або договору оренди.
      Самого проживання в гуртожитку без цих підстав недостатньо.
      Суму надбавки на рік дає таблиця сум цього року.
    deadlines_title: Терміни подання заяв
    deadlines_period_label: рік вікна подання
    deadlines_note: >-
      Вікно подання заяв може стосуватися іншого навчального року, ніж таблиця сум вище — ці періоди не змішуємо.
    documents_title: Документи
    documents_body: >-
      Електронна заява у Wirtualna Uczelnia. Для надбавки — скан договору про проживання або оренду.
      Повний перелік додатків: офіційна сторінка виплат / регламент. Позицій поза підтвердженими джерелами не вигадуємо.
    documents_status: partial
    links_title: Офіційні джерела
    form_title: Оцінка суми (не рішення)
    form_income: Дохід на особу в родині (злоті)
    form_year: Навчальний рік таблиці сум
    form_dorm: Цікавить надбавка за проживання
    form_submit: Порахувати оцінку
    form_hint: 0 злотих можна ввести, але таблиця 2025/2026 починається з 0,01 злотого — для 0,00 злотого немає групи і суми. Надбавку показуємо окремо, якщо умови не підтверджені.
    result_base: Базова сума (оцінка)
    result_group: Група доходу
    result_topup_conditional: Умовна надбавка (не в підсумку)
    result_topup_included: Надбавка (в підсумку — умови підтверджено)
    result_total_base_only: Сума для показу (лише база)
    result_total_with_topup: Сума (база + надбавка)
    result_not_eligibility: Це не рішення про право на стипендію.
    err_input: Некоректна сума доходу.
    err_outside_band: "{income} — коректний запис, але опублікована таблиця на рік {year} не призначає цій сумі групи і ставки (перша сума в таблиці: {min}). Виплату не називаємо і не вважаємо це групою I."
    err_over: Дохід перевищує поріг таблиці на цей рік — у цій таблиці немає суми.
    err_year: Немає підтвердженої таблиці сум UR на вибраний рік — розрахунок не вважається актуальним.
    err_eligibility: Бракує даних про право на виплату (статус студента, напрям тощо) — базову суму можна оцінити окремо; право не підтверджуємо.
    chat_card_header: Соціальна стипендія — перевірений сценарій (без мовної моделі)
    chat_see_form: Скористайтеся формою оцінки на сторінці, щоб визначити групу за доходом.
    chat_no_reask: Вже враховано дохід з форми / профілю.
    link_social_page: Соціальні стипендії (UR)
    link_regulamin: Регламент виплат (R-32/2024)
    verified_data_word: підтверджених даних
    year_banner_confirmed: "Таблицю сум підтверджено для року {year}."
    year_banner_unconfirmed: "Для року {year} немає підтвердженої таблиці сум UR — оцінка не вважається актуальною."
